# Run as a less privileged user for security reasons.
user nginx;

# #worker_threads to run;
# "auto" sets it to the #CPU_cores available in the system, and
# offers the best performance.
worker_processes    auto;

events { worker_connections 1024; }

http {
    server {
        # Hide nginx version information.
        server_tokens off;

        listen  80;
        root    /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 反向代理：/api/* -> GolangApiServer:5000/*
        # 前端 axios baseURL 为 /api/，浏览器请求同源地址，经此处转发到后端，
        # 因此通过任意 IP/域名访问（含局域网 IP）都能连上后端，无需再改前端构建地址。
        location /api/ {
            proxy_pass http://GolangApiServer:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 让后端知道外部前缀是 /api（Swagger 等生成相对链接/重定向时带上 /api）
            proxy_set_header X-Forwarded-Prefix /api;
        }

        # 反向代理：WebSocket 通知 /ws-notify/* -> GolangNotifyService:8088/ws/*
        location /ws-notify/ {
            proxy_pass http://GolangNotifyService:8088/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # 反向代理：WebSocket 聊天 /ws-chat/* -> GolangChatService:8001/ws/*
        location /ws-chat/ {
            proxy_pass http://GolangChatService:8001/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    
        gzip            on;
        gzip_vary       on;
        gzip_http_version 1.0;
        gzip_comp_level 5;
        gzip_types
                        application/atom+xml
                        application/javascript
                        application/json
                        application/rss+xml
                        application/vnd.ms-fontobject
                        application/x-font-ttf
                        application/x-web-app-manifest+json
                        application/xhtml+xml
                        application/xml
                        font/opentype
                        image/svg+xml
                        image/x-icon
                        text/css
                        text/plain
                        text/x-component;
        gzip_proxied    no-cache no-store private expired auth;
        gzip_min_length 256;
        gunzip          on;
    }
}