# 前端以 /app/ 为基路径对外托管（对应 vue.config.js publicPath '/app/'）。
# 静态文件放在镜像内 /usr/share/nginx/html/app 子目录（见 frontend/Dockerfile），
# history 路由（/app/Auth、/app/profile/:id 等）回退到 /app/index.html。
# /api、/ws-notify、/ws-chat 仍是站点根路径反代，保持不变。
user nginx;

worker_processes auto;

events { worker_connections 1024; }

http {
    server {
        # Hide nginx version information.
        server_tokens off;

        listen  80;
        root    /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        # ------------------------------------------------------------------
        #  安全响应头
        #  背景：生产环境实测只拿到上游网关给的 HSTS 与 X-Content-Type-Options，
        #  缺 CSP / X-Frame-Options / Referrer-Policy / Permissions-Policy，这里补齐。
        #
        #  CSP 取值依据（均为对构建产物的实测结论，不是照抄模板）：
        #   - script-src 'self'：dist/index.html 只用 <script defer src="/app/js/*.js">
        #     外链脚本，没有任何内联 <script>；打包产物里出现的唯一一处
        #     new Function("return this")() 是 webpack 运行时的 globalThis 兜底
        #     （dist/js/app.*.js 中 `typeof globalThis === "object"` 恒为真），
        #     该分支永远不会执行，因此不需要放开 'unsafe-eval'。已用无头浏览器
        #     带此 CSP 实际加载页面验证可正常渲染。
        #   - style-src 需要 'unsafe-inline'：Quasar 组件大量使用 style="..." 内联样式。
        #   - style-src/font-src 放行 Google Fonts：index.html 里引了
        #     fonts.googleapis.com 的样式表与 fonts.gstatic.com 的字体文件。
        #   - img-src 放行 data:/blob:/https:：头像是 base64 data URI 与远端 URL。
        #   - connect-src 放行 ws:/wss:：实时通知与聊天走 WebSocket。
        #   - HSTS 仍由上游 TLS 网关下发：本容器只监听明文 80，
        #     在明文响应里下发 HSTS 会被浏览器忽略，放在这里没有意义。
        # ------------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # 允许上传较大的请求体（帖图以 base64 放在 JSON 里，前端上限 5MB 图 -> ~6.7MB body）
        client_max_body_size 10m;

        # 容器健康检查端点（供 Dockerfile 的 HEALTHCHECK 使用）。
        # 注意：本 location 内不能出现 add_header，否则会整体覆盖上面 server 级继承的安全头。
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 根路径统一跳到 /app/，方便直接输入 http://47.98.169.176 访问
        location = / {
            return 301 /app/;
        }

        # 前端 SPA：/app/ 下静态资源 + history 模式回退
        location /app/ {
            try_files $uri $uri/ /app/index.html;
        }

        # 反向代理：/api/* -> GolangApiServer:5000/*
        # 前端 axios baseURL 为 /api/，浏览器请求同源地址，经此处转发到后端，
        # 因此通过任意 IP/域名访问（含局域网 IP）都能连上后端，无需再改前端构建地址。
        location /api/ {
            proxy_pass http://GolangApiServer:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 让后端知道外部前缀是 /api（Swagger 等生成相对链接/重定向时带上 /api）
            proxy_set_header X-Forwarded-Prefix /api;
        }

        # 反向代理：WebSocket 通知 /ws-notify/* -> GolangNotifyService:8088/ws/*
        location /ws-notify/ {
            proxy_pass http://GolangNotifyService:8088/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # 反向代理：WebSocket 聊天 /ws-chat/* -> GolangChatService:8001/ws/*
        location /ws-chat/ {
            proxy_pass http://GolangChatService:8001/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        gzip            on;
        gzip_vary       on;
        gzip_http_version 1.0;
        gzip_comp_level 5;
        gzip_types
                        application/atom+xml
                        application/javascript
                        application/json
                        application/rss+xml
                        application/vnd.ms-fontobject
                        application/x-font-ttf
                        application/x-web-app-manifest+json
                        application/xhtml+xml
                        application/xml
                        font/opentype
                        image/svg+xml
                        image/x-icon
                        text/css
                        text/plain
                        text/x-component;
        gzip_proxied    no-cache no-store private expired auth;
        gzip_min_length 256;
        gunzip          on;
    }
}
