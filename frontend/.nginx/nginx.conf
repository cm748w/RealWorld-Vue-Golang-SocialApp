# 前端以 /app/ 为基路径对外托管（对应 vue.config.js publicPath '/app/'）。
# 静态文件放在镜像内 /usr/share/nginx/html/app 子目录（见 frontend/Dockerfile），
# history 路由（/app/Auth、/app/profile/:id 等）回退到 /app/index.html。
# /api、/ws-notify、/ws-chat 仍是站点根路径反代，保持不变。
user nginx;

worker_processes auto;

events { worker_connections 1024; }

http {
    server {
        # Hide nginx version information.
        server_tokens off;

        listen  80;
        root    /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        # 允许上传较大的请求体（帖图以 base64 放在 JSON 里，前端上限 5MB 图 -> ~6.7MB body）
        client_max_body_size 10m;

        # 根路径统一跳到 /app/，方便直接输入 http://<主机IP> 访问
        location = / {
            return 301 /app/;
        }

        # 前端 SPA：/app/ 下静态资源 + history 模式回退
        location /app/ {
            try_files $uri $uri/ /app/index.html;
        }

        # 反向代理：/api/* -> GolangApiServer:5000/*
        # 前端 axios baseURL 为 /api/，浏览器请求同源地址，经此处转发到后端，
        # 因此通过任意 IP/域名访问（含局域网 IP）都能连上后端，无需再改前端构建地址。
        location /api/ {
            proxy_pass http://GolangApiServer:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 让后端知道外部前缀是 /api（Swagger 等生成相对链接/重定向时带上 /api）
            proxy_set_header X-Forwarded-Prefix /api;
        }

        # 反向代理：WebSocket 通知 /ws-notify/* -> GolangNotifyService:8088/ws/*
        location /ws-notify/ {
            proxy_pass http://GolangNotifyService:8088/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # 反向代理：WebSocket 聊天 /ws-chat/* -> GolangChatService:8001/ws/*
        location /ws-chat/ {
            proxy_pass http://GolangChatService:8001/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        gzip            on;
        gzip_vary       on;
        gzip_http_version 1.0;
        gzip_comp_level 5;
        gzip_types
                        application/atom+xml
                        application/javascript
                        application/json
                        application/rss+xml
                        application/vnd.ms-fontobject
                        application/x-font-ttf
                        application/x-web-app-manifest+json
                        application/xhtml+xml
                        application/xml
                        font/opentype
                        image/svg+xml
                        image/x-icon
                        text/css
                        text/plain
                        text/x-component;
        gzip_proxied    no-cache no-store private expired auth;
        gzip_min_length 256;
        gunzip          on;
    }
}
