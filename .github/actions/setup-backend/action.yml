name: "Setup Backend Environment"
description: "Sets up Go env and install backend dependencies"

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        # 跟随 go.mod 的 go 指令，避免版本写死后与 go.mod 漂移。
        # 原先写死 "1.26.1"，而 go.mod 已升到 1.26.8；setup-go 会设置
        # GOTOOLCHAIN=local，`go mod tidy` 直接报
        # "go.mod requires go >= 1.26.8 (running go 1.26.1)" 而失败。
        go-version-file: backend/api/go.mod
        cache: false # Go 模块缓存由下方 actions/cache 显式管理；setup-go 默认缓存只在仓库根目录找 go.sum（本项目在 backend/ 子目录）

    - name: Cache Go Modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('backend/api/go.sum', 'backend/realTimeChat/go.sum', 'backend/realTimeNotification/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Install dependencies
      run: |
        go mod tidy
        go mod download
      working-directory: ./backend/api
      shell: bash

    - name: Install test Dependencies
      run: go get -t ./tests/...
      working-directory: ./backend/api
      shell: bash
