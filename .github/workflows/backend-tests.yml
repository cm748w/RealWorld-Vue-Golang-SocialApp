name: "Backend Tests"

on:
  workflow_call:

jobs:
  backend-tests:
    name: Backend Go Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
      - name: Cache Go Modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/api/go.sum', 'backend/realTimeChat/go.sum', 'backend/realTimeNotification/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install dependencies
        run: |
          go mod tidy
          go mod download
        working-directory: ./backend/api

      - name: Install test Dependencies
        run: go get -t ./tests/...
        working-directory: ./backend/api

      - name: Wait for MongoDb To be ready
        run: |
          timeout 60 bash -c 'until nc -z localhost 27017; do echo "Waiting For MongoDB..."; sleep 2; done'
          echo "MongoDB is Ready!"

      - name: Run Go Tests
        run: go test ./tests/... -v
        working-directory: ./backend/api
        env: 
          TEST_MONGO_URI: mongodb://localhost:27017
