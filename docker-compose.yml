version: '3'
services:
  GolangApiServer:
    image: chenmonkey438/go-app-api
    container_name: GolangApiServer
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://admin:123456@mongodb:27017
      - JWT_SECRET=ud0PHx6T5jzz4PtH+tEcEwdrvcF98zft12kG0cTo9HA=
      - POSTS_PAGE_SIZE=2
      - POSTS_MAX_PAGE_SIZE=50
    networks:
      - app-network
    depends_on:
      - mongodb
  GolangChatService:
    image: chenmonkey438/go-app-chat
    container_name: GolangChatService
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - app-network
    depends_on:
      - mongodb
      - GolangApiServer
  GolangNotifyService:
    image: chenmonkey438/go-app-notify
    container_name: GolangNotifyService
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "8090:8090"
    networks:
      - app-network
    depends_on:
      - mongodb
      - GolangApiServer
  VueServer:
    image: chenmonkey438/vue-app-fe
    container_name: VueServer
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VUE_APP_API_URL=http://GolangApiServer:5000/
      - VUE_APP_RealTimeNotificationUrl=ws://GolangNotifyService:8088/ws/
      - VUE_APP_RealTimeChatUrl=ws://GolangChatService:8001/ws/
    networks:
      - app-network
    volumes:
      - dist:/dist
    depends_on:
      - GolangApiServer
      - GolangChatService
      - GolangNotifyService

  mongodb:
    container_name: mongodb
    image: mongo:7.0
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=123456
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network


volumes:
  dist:
    driver: local
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge