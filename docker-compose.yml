services:
  GolangApiServer:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    image: chenmonkey438/go-app-api
    container_name: GolangApiServer
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - POSTS_PAGE_SIZE=${POSTS_PAGE_SIZE}
      - POSTS_MAX_PAGE_SIZE=${POSTS_MAX_PAGE_SIZE}
      - GOLANG_NOTIFY_SERVICE_ADDR=${GOLANG_NOTIFY_SERVICE_ADDR}
      # 跨域白名单（仅当有“真正跨域”的调用方时才需要；同源访问（nginx 反代，浏览器与 API 同域名）无需任何配置）。
      # 需要时取消下行注释，并在根目录 .env 中设置，例如：
      #   CORS_ALLOWED_ORIGINS=https://你的域名,https://另一个域名
      # - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  GolangChatService:
    build:
      context: .
      dockerfile: backend/realTimeChat/Dockerfile
    image: chenmonkey438/go-app-chat
    container_name: GolangChatService
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GOLANG_API_SERVER_ADDR=${GOLANG_API_SERVER_ADDR}
      # WS 鉴权需要与 API 一致的 JWT_SECRET（否则令牌校验 fail-closed，聊天实时推送全挂）
      - JWT_SECRET=${JWT_SECRET}
      # 跨域白名单（可选，见 GolangApiServer 注释；同源访问无需配置）
      # - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    networks:
      - app-network
    depends_on:
      GolangApiServer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  GolangNotifyService:
    build:
      context: .
      dockerfile: backend/realTimeNotification/Dockerfile
    image: chenmonkey438/go-app-notify
    container_name: GolangNotifyService
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "8090:8090"
    environment:
      # WS 鉴权需要与 API 一致的 JWT_SECRET（否则令牌校验 fail-closed，通知推送全挂）
      - JWT_SECRET=${JWT_SECRET}
      # 跨域白名单（可选，见 GolangApiServer 注释；同源访问无需配置）
      # - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    networks:
      - app-network
    depends_on:
      GolangApiServer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  VueServer:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: chenmonkey438/vue-app-fe
    container_name: VueServer
    restart: unless-stopped
    # 服务器只开放 8080 端口 -> 宿主机 8080 映射到 nginx 容器内 80
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      GolangApiServer:
        condition: service_healthy
      GolangChatService:
        condition: service_healthy
      GolangNotifyService:
        condition: service_healthy

  mongodb:
    container_name: mongodb
    image: mongo:7.0
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge